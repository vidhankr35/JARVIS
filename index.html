
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>J.A.R.V.I.S. | Neural Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
          --app-height: 100dvh;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #010409;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: var(--app-height);
            width: 100vw;
            position: fixed; /* Prevents bounce and scroll issues on mobile */
        }
        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .mono { font-family: 'Space Mono', monospace; }
        .glass {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .glow-cyan {
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.1);
        }
        
        @keyframes scanline {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100%); }
        }

        .typing-cursor::after {
          content: '█';
          display: inline-block;
          margin-left: 3px;
          animation: blink 1s step-end infinite;
          color: rgba(34, 211, 238, 0.8);
        }

        @keyframes blink {
          from, to { opacity: 1; }
          50% { opacity: 0; }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(34, 211, 238, 0.2);
            border-radius: 10px;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.3); }

        .crt-overlay {
          pointer-events: none;
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
          z-index: 1000;
          background-size: 100% 4px, 4px 100%;
          opacity: 0.1;
        }

        /* Mobile specific fixes */
        @media (max-width: 768px) {
          .glass {
            backdrop-filter: blur(10px);
          }
          input, button {
            cursor: pointer;
            touch-action: manipulation;
          }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "three": "https://esm.sh/three@^0.182.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        // Handle mobile viewport keyboard adjustment
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', () => {
            document.body.style.height = window.visualViewport.height + 'px';
            window.scrollTo(0, 0);
          });
        }
    </script>
</body>
</html>
